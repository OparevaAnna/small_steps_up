version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: small-steps-up-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mauta
      POSTGRES_PASSWORD: mauta_secret
      POSTGRES_DB: small_steps_up
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: